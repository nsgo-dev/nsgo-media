name: NSGo Player
id: me.oneo.nsgoplayer
version: 0.1.0
icon:
  apple: assets/AppIcon.icon
  png: assets/app-icon.png

dev:
  target: native
  hot_reload: true

build:
  output: dist
  targets: [macos_arm64, macos_x64, windows_x64, linux_x64]

# The FFmpeg libraries load libva for VAAPI, and the core PulseAudio's
# client libraries for sound.
linux:
  categories: [AudioVideo, Video, Player]
  depends:
    deb: [libva2, libva-drm2, libpulse0]
    arch: [libva, libpulse]
