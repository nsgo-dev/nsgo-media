# The Linux packages of the PulseAudio client library the Linux backend
# loads, libpulse-simple.so.0, which NSGo's tool adds to an app's Debian and
# Arch packages. It bundles no library on any target.
version: 2
libraries:
  macos_arm64: []
  macos_x64: []
  windows_arm64: []
  windows_x64: []
  linux_arm64: []
  linux_x64: []
  ios: []
  ios_simulator: []
  tvos: []
  tvos_simulator: []
linux:
  linux_arm64:
    depends:
      deb: [libpulse0]
      arch: [libpulse]
  linux_x64:
    depends:
      deb: [libpulse0]
      arch: [libpulse]
